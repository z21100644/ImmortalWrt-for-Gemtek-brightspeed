name: Sync Upstream ImmortalWrt

on:
  schedule:
    - cron: '0 19 */3 * *'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type of the firmware build triggered after a sync with updates'
        required: true
        default: 'release'
        type: choice
        options:
          - none
          - release
          - prerelease

permissions:
  contents: write
  actions: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git 2>/dev/null || true
          git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Check for updates
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/master)
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "No updates available (upstream: ${REMOTE:0:7}, local: ${LOCAL:0:7})"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updates available: ${LOCAL:0:7} -> ${REMOTE:0:7}"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        if: steps.check.outputs.has_updates == 'true'
        id: merge
        run: |
          echo "old_base=$(git merge-base HEAD upstream/master)" >> "$GITHUB_OUTPUT"
          git merge --no-edit upstream/master || {
            echo "::error::Merge failed. Conflicts need manual resolution."
            git diff --name-only --diff-filter=U
            exit 1
          }

      - name: Push to origin
        if: steps.check.outputs.has_updates == 'true'
        run: git push origin master

      # GITHUB_TOKEN 的 push 不会触发其他 workflow，这里显式 dispatch 编译发布
      - name: Trigger firmware build
        if: steps.check.outputs.has_updates == 'true' && (inputs.release_type || 'release') != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_BASE: ${{ steps.merge.outputs.old_base }}
        run: |
          new_base=$(git rev-parse upstream/master)
          count=$(git rev-list --no-merges --count "$OLD_BASE..$new_base")
          notes=$(
            echo "自动同步上游 immortalwrt/immortalwrt：${OLD_BASE:0:8} → ${new_base:0:8}（${count} 个提交）"
            echo ""
            echo "https://github.com/immortalwrt/immortalwrt/compare/${OLD_BASE}...${new_base}"
            echo ""
            git log --no-merges --format='- %s' "$OLD_BASE..$new_base" | head -n 30
            [ "$count" -le 30 ] || echo "- ……"
          )
          gh workflow run build-firmware.yml \
            --ref master \
            -f config_seed=1710.config \
            -f release_type='${{ inputs.release_type || 'release' }}' \
            -f release_notes="$notes"

      - name: Show result
        if: always()
        run: |
          echo "=== Sync Result ==="
          git log --oneline -5 || true
          echo "=== Remote Status ==="
          git remote -v || true
